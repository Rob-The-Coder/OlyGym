apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// The cutover's key: the same one the shipping Capacitor app is signed with, so this APK installs
// over it as an update instead of as a second app. android-keys/ is gitignored and holds the
// password too (override it with $KS_PASS); the recipe and the certificate's SHA-256 are in
// android-keys/README.txt. Without the key — a fresh clone, or anyone else's machine — the release
// build is simply unsigned, which is what it was before the cutover.
def releaseKey = rootProject.file('../android-keys/olygym-release.jks')
def releasePassFile = rootProject.file('../android-keys/password.txt')
def releasePass = System.getenv('KS_PASS') ?: (releasePassFile.exists() ? releasePassFile.text.trim() : null)
def canSignRelease = releaseKey.exists() && releasePass

android {
    namespace = 'olygym.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'olygym.app'
        minSdk = 24
        targetSdk = 35
        // 26 is the last Capacitor build; Android refuses an update that is not above it.
        versionCode = 27
        // The native line is its own, and it is what the updater compares against native-v* tags.
        versionName = '0.1.0'
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile = releaseKey
                storePassword = releasePass
                keyAlias = 'olygym'
                keyPassword = releasePass
            }
        }
    }

    buildTypes {
        debug {
            // The dev build keeps its own sandbox: the release one is the shipped app now, and two
            // builds of the same package signed with different keys cannot share a phone anyway.
            applicationIdSuffix '.dev'
        }
        release {
            if (canSignRelease) signingConfig = signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.time on minSdk 24. The date helpers are the ones that need it.
        coreLibraryDesugaringEnabled true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    // Navigation, the library Komikku uses (cafe.adriel.voyager). It replaces the
    // navigation-compose named in docs/PORT-TO-KOTLIN.md, which is not in the offline cache.
    implementation 'cafe.adriel.voyager:voyager-navigator:1.1.0-beta03'
    implementation 'cafe.adriel.voyager:voyager-tab-navigator:1.1.0-beta03'
    implementation 'cafe.adriel.voyager:voyager-transitions:1.1.0-beta03'
    implementation 'cafe.adriel.voyager:voyager-screenmodel:1.1.0-beta03'

    testImplementation 'junit:junit:4.13.2'
}

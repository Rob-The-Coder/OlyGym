<svg xmlns="http://www.w3.org/2000/svg" width="660" height="190" viewBox="0 0 660 190" role="img" aria-label="OlyGym — local-only Olympic weightlifting tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151219"/>
      <stop offset="1" stop-color="#0f0d13"/>
    </linearGradient>
  </defs>
  <rect width="660" height="190" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="657" height="187" rx="20.5" fill="none" stroke="#48454d" stroke-width="3"/>

  <!-- dumbbell mark (centered to the text block) -->
  <g transform="translate(122,96) scale(0.8)" fill="#d2bbff">
    <rect x="-72" y="-10" width="144" height="20" rx="7"/>
    <rect x="-80" y="-36" width="20" height="72" rx="7"/>
    <rect x="-104" y="-25" width="17" height="50" rx="7"/>
    <rect x="60"  y="-36" width="20" height="72" rx="7"/>
    <rect x="87"  y="-25" width="17" height="50" rx="7"/>
  </g>

  <!-- wordmark + tagline. The colours are the app's own violet-theme roles:
       #d2bbff primary, #e4e1ea on-surface, #c8c5ce on-surface-variant,
       #928f98 outline, #151219 surface, #48454d outline-variant. -->
  <text x="224" y="86" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">
    <tspan fill="#e4e1ea">Oly</tspan><tspan fill="#d2bbff">Gym</tspan>
  </text>
  <text x="226" y="120" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20.5" font-weight="600" fill="#c8c5ce">Local-only Olympic weightlifting tracker</text>
  <text x="226" y="146" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#928f98">Android + PWA  ·  no account  ·  no server  ·  AGPL</text>
</svg>